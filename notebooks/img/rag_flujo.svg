<svg xmlns="http://www.w3.org/2000/svg" width="680" height="350" viewBox="0 0 680 350" role="img" font-family="Segoe UI, Helvetica, Arial, sans-serif">
<title>Vectorizacion y recuperacion en un espacio vectorial</title>
<desc>Los documentos se fragmentan y se convierten en vectores. La pregunta se convierte en otro vector y el retriever devuelve los puntos mas cercanos.</desc>
